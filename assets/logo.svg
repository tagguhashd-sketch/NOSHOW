<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ReturnPulse logo">
  <defs>
    <linearGradient id="rp-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12b3a6"/>
      <stop offset="0.55" stop-color="#1a8fd6"/>
      <stop offset="1" stop-color="#4b45d6"/>
    </linearGradient>
    <linearGradient id="rp-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="122" fill="url(#rp-grad)"/>
  <rect width="512" height="256" rx="122" fill="url(#rp-sheen)"/>

  <!-- ping / reminder dot with ripple -->
  <circle cx="398" cy="132" r="58" fill="#ffffff" opacity="0.18"/>
  <circle cx="398" cy="132" r="36" fill="#ffffff" opacity="0.32"/>
  <circle cx="398" cy="132" r="20" fill="#ffffff"/>

  <!-- ECG pulse line -->
  <path d="M52 300 H140 L176 196 L224 386 L266 262 L296 322 H460"
        fill="none" stroke="#ffffff" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
